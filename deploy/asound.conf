# Configuración ALSA para el agente de voz — NanoPi R4S + USB PnP Sound Device (TI PCM2902)
#
# POR QUÉ EXISTE ESTE FICHERO
# ---------------------------
# La tarjeta USB de esta placa es muy limitada. Sus capacidades reales
# (comprobadas con `arecord -D hw:0,0 --dump-hw-params`) son:
#
#     FORMAT:   S16_LE  (y nada más)
#     RATE:     [44100 48000]   <-- NO soporta 16000 Hz
#     CHANNELS: captura = 1 (mono), reproducción = 2 (estéreo)
#
# Pipecat, Silero VAD, Whisper y Piper trabajan en mono a 16 kHz. Si abriéramos
# `hw:0,0` directamente, PortAudio fallaría al pedir 16 kHz y, en reproducción,
# fallaría además al pedir 1 canal. El error de PyAudio en ese caso es opaco
# ("Invalid sample rate"), así que es un fallo caro de diagnosticar.
#
# La solución es interponer el plugin `plug` de alsa-lib, que hace conversión
# automática de frecuencia de muestreo, formato y número de canales. Encima
# usamos `dmix` (salida) y `dsnoop` (entrada), que además permiten que varios
# procesos abran la tarjeta a la vez: así puedes lanzar `aplay`/`arecord` de
# diagnóstico mientras el agente está corriendo, en vez de recibir un
# "Device or resource busy".
#
# Este mismo fichero se copia a /etc/asound.conf tanto en el host (desarrollo
# nativo) como dentro de la imagen del contenedor, de forma que el
# comportamiento del audio es idéntico en ambos entornos.
#
# Se referencia la tarjeta por nombre (`CARD=Device`, el id que aparece en
# /proc/asound/cards) y no por índice, porque el índice puede cambiar si algún
# día se conecta otra tarjeta.

# --- Salida: mezclador software a 48 kHz estéreo ------------------------------
pcm.va_dmix {
    type dmix
    ipc_key 29020
    ipc_perm 0660
    slave {
        pcm "hw:CARD=Device,DEV=0"
        format S16_LE
        rate 48000
        channels 2
        period_size 1024      # 21.3 ms @ 48 kHz
        buffer_size 4096      # 85.3 ms @ 48 kHz
    }
}

# --- Entrada: captura compartida a 48 kHz mono --------------------------------
pcm.va_dsnoop {
    type dsnoop
    ipc_key 29021
    ipc_perm 0660
    slave {
        pcm "hw:CARD=Device,DEV=0"
        format S16_LE
        rate 48000
        channels 1
        period_size 1024
        buffer_size 4096
    }
}

# --- Envoltorios `plug`: conversión rate/formato/canales al vuelo -------------
pcm.va_out {
    type plug
    slave.pcm "va_dmix"
}

pcm.va_in {
    type plug
    slave.pcm "va_dsnoop"
}

# --- Dispositivo por defecto: asimétrico (entrada y salida distintas) ---------
# Es lo que abre PyAudio/PortAudio cuando pedimos el dispositivo "default".
pcm.!default {
    type asym
    playback.pcm "va_out"
    capture.pcm "va_in"
}

ctl.!default {
    type hw
    card Device
}
