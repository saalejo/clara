[project]
name = "voice-agent-telefonia"
version = "0.1.0"
description = "Puente Bluetooth manos libres (HFP-HF) entre el móvil y el agente de voz"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Este paquete existe para que estas dependencias NO entren en la imagen del
# agente, igual que `packages/panel` existe para que Django no entre. Cada
# Containerfile hace `uv sync --package <x>`, así que lo que no esté en esta
# lista sencillamente no se instala allí. Ver packages/telefonia/README.md.
dependencies = [
    # Contrato compartido (los modelos de voice_agent_core.telefonia) y Settings.
    "voice-agent-core",

    # Cliente D-Bus asíncrono. La elección está razonada en README.md y no es
    # cosmética: jeepney —que ya usa el panel— no puede recibir descriptores de
    # fichero en su backend de asyncio, y el audio SCO de la fase 2 llega
    # justamente como un descriptor.
    "dbus-fast>=2.44,<3",

    # La capa HTTP sobre el socket unix. Ambas están ya en el uv.lock porque el
    # panel las usa, así que no añaden resolución nueva.
    "starlette>=0.47",
    "uvicorn>=0.34",

    # Logging estructurado, como el resto del proyecto.
    "loguru>=0.7,<0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent_telefonia"]
