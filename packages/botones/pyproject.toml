[project]
name = "voice-agent-botones"
version = "0.1.0"
description = "Mando físico del agente de voz: los botones de la tarjeta de sonido USB gobiernan servicios, micrófono, volumen y llamadas"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Este paquete existe por lo mismo que `packages/telefonia`: para que sus
# dependencias no entren en ninguna imagen. Corre NATIVO en la placa, porque un
# contenedor no ve `/dev/input` y no puede gobernar el systemd del usuario. Ver
# packages/botones/README.md.
#
# La lista es corta a propósito. Todo lo que se puede hacer con la biblioteca
# estándar se hace con ella:
#
#   - leer `/dev/input/eventN`   -> `struct` + `loop.add_reader`, no `python-evdev`
#   - generar los pitidos        -> `wave` + `math`, no una dependencia de audio
#   - hablar con `amixer`/`aplay`-> `asyncio.create_subprocess_exec`
#   - hablar con systemd         -> `voice_agent_core.systemd` (jeepney, vía core)
dependencies = [
    # El contrato compartido: `Settings`, los modelos de telefonía y el control
    # de unidades de systemd por D-Bus.
    "voice-agent-core",

    # Cliente HTTP del puente de telefonía, por socket unix (`uds=`). Es la
    # misma pieza que usa el agente en `src/voice_agent/telefonia.py`, con el
    # mismo motivo: el puente no publica ningún puerto TCP.
    "httpx>=0.28,<1",

    # Logging estructurado, como el resto del proyecto.
    "loguru>=0.7,<0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent_botones"]
